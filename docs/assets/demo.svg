e"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard </tspan></text><text id="t14" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard d</tspan></text><text id="t15" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard de</tspan></text><text id="t16" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard dem</tspan></text><text id="t17" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo</tspan></text><text x="28" y="68" xml:space="preserve"><tspan fill="#4c8dff" font-weight="700">$ </tspan></text><text id="l0" x="28" y="89" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">JourneyGuard demo</tspan><tspan fill="#e8eefc"> · demo shop running at </tspan><tspan fill="#38bdf8">http://127.0.0.1:38009</tspan></text><text id="l1" x="28" y="120" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">1) The shop is healthy:</tspan></text><text id="l2" x="28" y="151" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Shop checkout (WooCommerce)  </tspan><tspan fill="#34d399" font-weight="700">PASSED</tspan><tspan fill="#8494b6">  562ms</tspan></text><text id="l3" x="28" y="172" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Website</tspan></text><text id="l4" x="28" y="193" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Products</tspan></text><text id="l5" x="28" y="214" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Add to cart</tspan></text><text id="l6" x="28" y="235" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Checkout</tspan></text><text id="l7" x="28" y="256" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Payment</tspan></text><text id="l8" x="28" y="277" xml:space="preserve"><tspan fill="#8494b6">  ○ Place order — not tested (Safe mode: JourneyGuard never submits real orders or payments)</tspan></text><text id="l9" x="28" y="308" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Contact form  </tspan><tspan fill="#34d399" font-weight="700">PASSED</tspan><tspan fill="#8494b6">  389ms</tspan></text><text id="l10" x="28" y="339" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Website health  </tspan><tspan fill="#34d399" font-weight="700">PASSED</tspan><tspan fill="#8494b6">  85ms</tspan></text><text id="l11" x="28" y="370" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">2) Now we break it (--break checkout) — this is what an owner normally never notices:</tspan></text><text id="l12" x="28" y="401" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Shop checkout (WooCommerce)  </tspan><tspan fill="#f87171" font-weight="700">FAILED</tspan><tspan fill="#8494b6">  473ms</tspan></text><text id="l13" x="28" y="422" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Website</tspan></text><text id="l14" x="28" y="443" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Products</tspan></text><text id="l15" x="28" y="464" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Add to cart</tspan></text><text id="l16" x="28" y="485" xml:space="preserve"><tspan fill="#f87171">  ✖</tspan><tspan fill="#e8eefc"> Checkout </tspan><tspan fill="#8494b6">—</tspan><tspan fill="#e8eefc"> </tspan><tspan fill="#f87171">HTTP 500 on http://127.0.0.1:38009/checkout/</tspan></text><text id="l17" x="28" y="506" xml:space="preserve"><tspan fill="#8494b6">  ○ Payment — not tested (Not reached: &quot;Checkout&quot; failed)</tspan></text><text id="l18" x="28" y="527" xml:space="preserve"><tspan fill="#f87171">  →</tspan><tspan fill="#e8eefc"> </tspan><tspan fill="#e8eefc" font-weight="700">PHP/WordPress fatal error</tspan></text><text id="l19" x="28" y="548" xml:space="preserve"><tspan fill="#8494b6">    Usually caused by a plugin or theme update, or a PHP version change. </tspan><tspan class="w" x="28" dy="21">    </tspan><tspan fill="#8494b6">Check the PHP error log and recently updated plugins.</tspan></text><text id="l20" x="28" y="590" xml:space="preserve"><tspan fill="#8494b6">  Homepage load: 14ms · Product: Espresso Blend 250g · Items in cart: 1</tspan></text><text id="l21" x="28" y="611" xml:space="preserve"><tspan fill="#e8eefc">  </tspan><tspan fill="#8494b6">Screenshot:</tspan><tspan fill="#e8eefc"> /tmp/journeyguard-demo-ImMHF3/runs/aegean-coffee-co-demo/woocommerce/</tspan><tspan class="w" x="28" dy="21">              </tspan><tspan fill="#e8eefc">2026-11-08T22-03-48-230Z-c4f3/failure.png</tspan></text><text id="l22" x="28" y="663" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Dashboard:</tspan><tspan fill="#e8eefc"> </tspan><tspan fill="#38bdf8">http://localhost:8080</tspan><tspan fill="#e8eefc">   </tspan><tspan fill="#8494b6">(Ctrl+C to stop)</tspan></text>
