e"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard </tspan></text><text id="t14" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard d</tspan></text><text id="t15" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard de</tspan></text><text id="t16" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard dem</tspan></text><text id="t17" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo</tspan></text><text id="t18" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo </tspan></text><text id="t19" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo -</tspan></text><text id="t20" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --</tspan></text><text id="t21" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --l</tspan></text><text id="t22" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --la</tspan></text><text id="t23" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --lan</tspan></text><text id="t24" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --lang</tspan></text><text id="t25" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --lang </tspan></text><text id="t26" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --lang e</tspan></text><text id="t27" x="28" y="68" xml:space="preserve"><tspan fill-opacity="0" font-weight="700">$ </tspan><tspan fill="#e8eefc" font-weight="700">journeyguard demo --lang el</tspan></text><text x="28" y="68" xml:space="preserve"><tspan fill="#4c8dff" font-weight="700">$ </tspan></text><text id="l0" x="28" y="89" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">JourneyGuard demo</tspan><tspan fill="#e8eefc"> · το δοκιμαστικό eShop τρέχει στο </tspan><tspan fill="#38bdf8">http://127.0.0.1:39227</tspan></text><text id="l1" x="28" y="120" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">1) Το eShop λειτουργεί κανονικά:</tspan></text><text id="l2" x="28" y="151" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Αγορά από το eShop (WooCommerce)  </tspan><tspan fill="#34d399" font-weight="700">ΕΠΙΤΥΧΙΑ</tspan><tspan fill="#8494b6">  508ms</tspan></text><text id="l3" x="28" y="172" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Ιστοσελίδα</tspan></text><text id="l4" x="28" y="193" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Προϊόντα</tspan></text><text id="l5" x="28" y="214" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Καλάθι</tspan></text><text id="l6" x="28" y="235" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Ταμείο</tspan></text><text id="l7" x="28" y="256" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Πληρωμή</tspan></text><text id="l8" x="28" y="277" xml:space="preserve"><tspan fill="#8494b6">  ○ Υποβολή παραγγελίας — δεν ελέγχθηκε (Ασφαλής λειτουργία: το JourneyGuard δεν υποβάλλει</tspan><tspan class="w" x="28" dy="21">    </tspan><tspan fill="#8494b6">ποτέ πραγματικές παραγγελίες ή πληρωμές)</tspan></text><text id="l9" x="28" y="329" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Φόρμα επικοινωνίας  </tspan><tspan fill="#34d399" font-weight="700">ΕΠΙΤΥΧΙΑ</tspan><tspan fill="#8494b6">  330ms</tspan></text><text id="l10" x="28" y="360" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Υγεία ιστοσελίδας  </tspan><tspan fill="#34d399" font-weight="700">ΕΠΙΤΥΧΙΑ</tspan><tspan fill="#8494b6">  80ms</tspan></text><text id="l11" x="28" y="391" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">2) Τώρα το «σπάμε» (--break checkout): αυτό συνήθως δεν το προσέχει κανείς:</tspan></text><text id="l12" x="28" y="422" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Aegean Coffee Co. (demo)</tspan><tspan fill="#e8eefc"> › Αγορά από το eShop (WooCommerce)  </tspan><tspan fill="#f87171" font-weight="700">ΑΠΟΤΥΧΙΑ</tspan><tspan fill="#8494b6">  439ms</tspan></text><text id="l13" x="28" y="443" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Ιστοσελίδα</tspan></text><text id="l14" x="28" y="464" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Προϊόντα</tspan></text><text id="l15" x="28" y="485" xml:space="preserve"><tspan fill="#34d399">  ✔</tspan><tspan fill="#e8eefc"> Καλάθι</tspan></text><text id="l16" x="28" y="506" xml:space="preserve"><tspan fill="#f87171">  ✖</tspan><tspan fill="#e8eefc"> Ταμείο </tspan><tspan fill="#8494b6">—</tspan><tspan fill="#e8eefc"> </tspan><tspan fill="#f87171">HTTP 500 στη σελίδα http://127.0.0.1:39227/checkout/</tspan></text><text id="l17" x="28" y="527" xml:space="preserve"><tspan fill="#8494b6">  ○ Πληρωμή — δεν ελέγχθηκε (Δεν εκτελέστηκε, γιατί απέτυχε το βήμα «Ταμείο»)</tspan></text><text id="l18" x="28" y="548" xml:space="preserve"><tspan fill="#f87171">  →</tspan><tspan fill="#e8eefc"> </tspan><tspan fill="#e8eefc" font-weight="700">Κρίσιμο σφάλμα PHP/WordPress</tspan></text><text id="l19" x="28" y="569" xml:space="preserve"><tspan fill="#8494b6">    Συνήθως οφείλεται σε ενημέρωση plugin ή θέματος, ή σε αλλαγή έκδοσης PHP.</tspan><tspan class="w" x="28" dy="21">    </tspan><tspan fill="#8494b6">Ελέγξτε το PHP error log και τα πρόσφατα ενημερωμένα plugins.</tspan></text><text id="l20" x="28" y="611" xml:space="preserve"><tspan fill="#8494b6">  Φόρτωση αρχικής: 19ms · Προϊόν: Espresso Blend 250g · Τεμάχια στο καλάθι: 1</tspan></text><text id="l21" x="28" y="632" xml:space="preserve"><tspan fill="#e8eefc">  </tspan><tspan fill="#8494b6">Στιγμιότυπο:</tspan><tspan fill="#e8eefc"> /tmp/journeyguard-demo-gezDz7/runs/aegean-coffee-co-demo/woocommerce/</tspan><tspan class="w" x="28" dy="21">               </tspan><tspan fill="#e8eefc">2026-11-08T21-53-13-364Z-2b65/failure.png</tspan></text><text id="l22" x="28" y="684" xml:space="preserve"><tspan fill="#e8eefc" font-weight="700">Πίνακας ελέγχου:</tspan><tspan fill="#e8eefc"> </tspan><tspan fill="#38bdf8">http://localhost:8080</tspan><tspan fill="#e8eefc">   </tspan><tspan fill="#8494b6">(Ctrl+C για τερματισμό)</tspan></text>
