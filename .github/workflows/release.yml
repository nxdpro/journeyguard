name: Release

# Release by pushing a tag (v0.2.0), or with "Run workflow" on the Actions tab: that tags the
# current main with the version in package.json and releases it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Two clicks on "Run workflow" must not publish twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version from package.json (and the tag, when one was pushed)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run releases from the default branch"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Set the next version in package.json and CHANGELOG.md first (CONTRIBUTING.md, Releasing)."; exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test

  tag:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag this commit (a re-run of the same commit reuses the tag; another commit is refused)
        run: |
          existing="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [ -z "$existing" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists on another commit. Set the next version in package.json first."; exit 1
          fi

  docker:
    needs: [verify, tag]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # GHCR shows the description of a multi-arch image from the index annotations.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for this runner and smoke-test before publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: journeyguard:release-test
      - name: Smoke test
        run: |
          docker run --rm journeyguard:release-test --version
          docker run -d --name demo -p 8080:8080 --shm-size=1g journeyguard:release-test demo --host 0.0.0.0
          for i in $(seq 1 60); do curl -fsS localhost:8080/healthz >/dev/null 2>&1 && break; sleep 2; done
          docker logs demo > demo.log 2>&1; cat demo.log
          curl -fsS localhost:8080/healthz
          sed -n '/^1) The shop is healthy/,/^2) Now we break it/p' demo.log > healthy.log
          sed -n '/^2) Now we break it/,$p' demo.log > broken.log
          [ "$(grep -c ' PASSED ' healthy.log)" -eq 3 ] || { echo "::error::A journey did not pass on the healthy demo shop"; exit 1; }
          grep -q 'Shop checkout (WooCommerce)  FAILED' broken.log || { echo "::error::The broken checkout was not caught"; exit 1; }
          docker rm -f demo
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.verify.outputs.tag, '-') }}
          labels: |
            org.opencontainers.image.description=Open-source monitoring for checkout, sign-up and contact-form journeys
          annotations: |
            org.opencontainers.image.description=Open-source monitoring for checkout, sign-up and contact-form journeys
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  npm:
    needs: [verify, tag]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          tag=latest
          case "${{ needs.verify.outputs.tag }}" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publishing not configured
        if: env.NPM_TOKEN == ''
        run: echo "::notice::npm publishing is not set up (no NPM_TOKEN secret), so this release is on GitHub and GHCR only."

  github-release:
    needs: [verify, docker]
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          printf '\n### Install\n\n```bash\ndocker pull ghcr.io/%s:%s\ndocker run --rm ghcr.io/%s:%s check https://your-shop.com\n```\n\nFull setup: [Quick start](https://github.com/%s#quick-start)\n' \
            "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      - name: Create the GitHub release (versions like 0.2.0-beta.1 are marked as pre-releases)
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; left unchanged."; exit 0
          fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --notes-file notes.md --title "JourneyGuard $TAG" --verify-tag $flags
