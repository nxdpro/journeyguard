# A Shopify store. Shopify may show a bot challenge on checkout; JourneyGuard then reports
# the stage as "not tested" instead of a false alarm.
sites:
  - name: My Shopify Store
    url: https://your-store.myshopify.com   # replace with your store
    journeys:
      - preset: website
      - preset: shopify
        options:
          # productHandle: test-product
          payment: true
